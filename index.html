<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Runway – Student Money Planner</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--tx:#1c1b17;--mu:#6b6a62;--bd:#dedcd2;--ac:#8a6100;--acx:#fff;--bad:#c0392b;--ok:#1c7a4a}
@media(prefers-color-scheme:dark){:root{--bg:#131310;--card:#1d1c17;--tx:#ece9dd;--mu:#a09e90;--bd:#35332a;--ac:#f2c14e;--acx:#2a1f00;--bad:#ff8a7a;--ok:#6fd3a0}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 "Segoe UI",system-ui,sans-serif}
header,main{max-width:1200px;margin:0 auto;padding:14px 20px}
h1{font:700 1.9rem/1.2 Georgia,serif;margin:0}
h2{font:600 1.05rem Georgia,serif;margin:16px 0 6px}
.sub,small{color:var(--mu)}
.sub{margin:2px 0 0}
small{font-size:12px}
.layout{display:grid;gap:14px;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);align-items:start}
@media(max-width:900px){.layout{grid-template-columns:1fr}}
.box,.card{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:14px}
label{display:block;font-weight:600;font-size:13px;margin-bottom:8px}
input,select{font:inherit;color:var(--tx);padding:6px 8px;border-radius:6px;border:1px solid var(--bd);background:var(--bg);width:100%;min-width:0}
input[type=range]{padding:0;border:0;accent-color:var(--ac)}
button{font:inherit;color:var(--tx);padding:6px 12px;border-radius:6px;border:1px solid var(--bd);background:var(--card);cursor:pointer}
button.p{background:var(--ac);color:var(--acx);border-color:var(--ac);font-weight:600}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.row{display:grid;gap:6px;margin-bottom:6px;align-items:center}
.row button{padding:4px 0;color:var(--bad)}
.two{display:grid;grid-template-columns:90px 1fr 110px;gap:8px;align-items:end}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.cards{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-bottom:12px}
.card b{display:block;font:700 1.35rem/1.25 Georgia,serif}
.good{color:var(--ok)}.bad{color:var(--bad)}
svg{width:100%;height:auto;display:block}
svg text{fill:var(--mu);font-size:10px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:right;padding:5px 6px;border-bottom:1px solid var(--bd)}
th:first-child,td:first-child{text-align:left}
.sl{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:560px){.sl{grid-template-columns:1fr}}
.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mu);margin-top:4px}
</style>
</head>
<body>
<header>
  <h1>Runway</h1>
  <p class="sub">See how long your money lasts, find a safe daily spend, and test what-if changes before they happen.</p>
</header>
<main class="layout">
  <section class="box" id="form" aria-label="Your money"></section>
  <section id="res" aria-live="polite"></section>
</main>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ymd=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const T0=(()=>{const d=new Date();d.setHours(0,0,0,0);return d})();
const plus=n=>{const d=new Date(T0);d.setDate(d.getDate()+n);return ymd(d)};
const SAMPLE=()=>({cur:"₹",bal:15000,H:6,cut:0,extra:0,
 inc:[{n:"Parents allowance",a:12000,d:1},{n:"Tutoring",a:4000,d:15}],
 fix:[{n:"Hostel mess",a:5500,d:5},{n:"Phone plan",a:399,d:10},{n:"Streaming",a:199,d:12},{n:"Gym",a:500,d:3}],
 vr:[{n:"Eating out",a:1200},{n:"Transport",a:400},{n:"Fun and misc",a:600}],
 one:[{n:"Exam fees",a:-3500,date:plus(40)},{n:"Weekend trip",a:-6000,date:plus(85)},{n:"Scholarship",a:8000,date:plus(120)}],
 goals:[{n:"Laptop fund",t:40000,s:5000,date:plus(240)}]});
let S=SAMPLE();
try{const x=JSON.parse(localStorage.getItem("runway-v1"));if(x&&x.inc)S=x}catch(e){}
const save=()=>{try{localStorage.setItem("runway-v1",JSON.stringify(S))}catch(e){}};
const num=v=>+v||0;
const fmt=n=>(n<0?"−":"")+S.cur+Math.abs(Math.round(n)).toLocaleString(S.cur==="₹"?"en-IN":undefined);
const dlabel=d=>d.toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"});

function sim(cut,extra){
  const end=new Date(T0);end.setMonth(end.getMonth()+num(S.H));
  const n=Math.round((end-T0)/864e5),bal=[],dts=[],inf=[],out=[];
  let b=num(S.bal);
  const vd=S.vr.reduce((a,v)=>a+num(v.a),0)/7*(1-cut/100);
  for(let i=0;i<n;i++){
    const d=new Date(T0);d.setDate(d.getDate()+i);
    const dim=new Date(d.getFullYear(),d.getMonth()+1,0).getDate(),dd=d.getDate(),k=ymd(d);
    const on=x=>Math.min(Math.max(1,num(x.d)||1),dim)===dd;
    let gi=0,go=vd;
    S.inc.forEach(x=>{if(on(x))gi+=num(x.a)});
    if(extra&&dd===1)gi+=extra;
    S.fix.forEach(x=>{if(on(x))go+=num(x.a)});
    S.one.forEach(x=>{if(x.date===k){const a=num(x.a);if(a>=0)gi+=a;else go-=a}});
    b+=gi-go;bal.push(b);dts.push(d);inf.push(gi);out.push(go);
  }
  return{bal,dts,inf,out,vd};
}
function metrics(r){
  const run=r.bal.findIndex(x=>x<0);
  let safe=Infinity,min=Infinity,mi=0;
  r.bal.forEach((x,i)=>{safe=Math.min(safe,x/(i+1));if(x<min){min=x;mi=i}});
  const months=Math.max(1,r.bal.length/30.4);
  const net=(r.inf.reduce((a,b)=>a+b,0)-r.out.reduce((a,b)=>a+b,0))/months;
  return{run,safe,min,mi,end:r.bal[r.bal.length-1],net};
}

function chart(base,sc,showBase,mS){
  const W=600,Hh=230,pl=8,pb=22,all=base.bal.concat(sc.bal),lo=Math.min(0,...all),hi=Math.max(1,...all),n=base.bal.length;
  const X=i=>pl+i/(n-1||1)*(W-pl*2),Y=v=>(Hh-pb)-(v-lo)/(hi-lo)*(Hh-pb-10);
  const pts=r=>r.bal.map((v,i)=>`${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(" ");
  let s=`<svg viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Projected balance over time"><rect x="0" y="${Y(0)}" width="${W}" height="${Hh-pb-Y(0)}" fill="var(--bad)" opacity=".12"/><line x1="0" x2="${W}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--mu)" stroke-dasharray="3 3"/>`;
  base.dts.forEach((d,i)=>{if(d.getDate()===1)s+=`<text x="${X(i)}" y="${Hh-6}" text-anchor="middle">${d.toLocaleDateString(undefined,{month:"short"})}</text>`});
  if(showBase)s+=`<polyline points="${pts(base)}" fill="none" stroke="var(--mu)" stroke-width="2" stroke-dasharray="5 4"/>`;
  s+=`<polyline points="${pts(sc)}" fill="none" stroke="var(--ac)" stroke-width="2.5"/>`;
  if(mS.run>=0)s+=`<circle cx="${X(mS.run)}" cy="${Y(0)}" r="5" fill="var(--bad)"/><text x="${X(mS.run)}" y="${Y(0)-9}" text-anchor="middle" style="fill:var(--bad);font-weight:700">runs out</text>`;
  s+=`<text x="${pl}" y="12">${fmt(hi)}</text></svg>`;
  return s;
}

function renderRes(){
  const base=sim(0,0),sc=sim(num(S.cut),num(S.extra));
  const mB=metrics(base),mS=metrics(sc),changed=num(S.cut)||num(S.extra);
  const dayTxt=m=>m.run>=0?`${dlabel(sc.dts[m.run])}`:"";
  const vdSet=num(S.vr.reduce((a,v)=>a+num(v.a),0))/7*(1-num(S.cut)/100);
  let h=`<div class="cards">
  <div class="card"><small>Money runway</small><b class="${mS.run>=0?"bad":"good"}">${mS.run>=0?`Runs out ${dlabel(sc.dts[mS.run])}`:`Lasts all ${S.H} months`}</b><small>${mS.run>=0?`in ${mS.run+1} days`:`Ends with ${fmt(mS.end)}`}${changed?` · baseline: ${mB.run>=0?"runs out "+dlabel(base.dts[mB.run]):"lasts"}`:""}</small></div>
  <div class="card"><small>Lowest balance</small><b class="${mS.min<0?"bad":""}">${fmt(mS.min)}</b><small>on ${dlabel(sc.dts[mS.mi])}</small></div>
  <div class="card"><small>${mS.safe>=0?"Room to spend extra":"Cut needed"} per day</small><b class="${mS.safe>=0?"good":"bad"}">${fmt(Math.abs(mS.safe))}</b><small>${mS.safe>=0?`on top of ${fmt(vdSet)} a day, without hitting zero`:"to avoid hitting zero"}</small></div>
  <div class="card"><small>Average monthly net</small><b class="${mS.net<0?"bad":"good"}">${fmt(mS.net)}</b><small>income minus all spending</small></div></div>
  <div class="box"><h2 style="margin-top:0">Projected balance</h2>${chart(base,sc,changed,mS)}<div class="leg"><span style="color:var(--ac)">━ Your plan${changed?" with changes":""}</span>${changed?"<span>┅ Baseline</span>":""}<span style="color:var(--bad)">Red zone: below zero</span></div>
  <h2>What if?</h2><div class="sl"><label>Cut daily spending by ${S.cut}%<input type="range" id="cut" min="0" max="50" step="5" value="${S.cut}"></label><label>Extra income each month: ${fmt(num(S.extra))}<input type="range" id="extra" min="0" max="10000" step="500" value="${S.extra}"></label></div></div>`;
  const months={};
  sc.dts.forEach((d,i)=>{const k=d.getFullYear()*12+d.getMonth(),m=months[k]||(months[k]={l:d.toLocaleDateString(undefined,{month:"short",year:"2-digit"}),i:0,o:0,e:0});m.i+=sc.inf[i];m.o+=sc.out[i];m.e=sc.bal[i]});
  h+=`<div class="box" style="margin-top:12px"><h2 style="margin-top:0">Month by month</h2><div style="overflow-x:auto"><table><tr><th>Month</th><th>In</th><th>Out</th><th>End balance</th></tr>${Object.values(months).map(m=>`<tr><td>${m.l}</td><td>${fmt(m.i)}</td><td>${fmt(m.o)}</td><td class="${m.e<0?"bad":""}">${fmt(m.e)}</td></tr>`).join("")}</table></div></div>`;
  if(S.goals.length){
    let need=0;
    const rows=S.goals.map(g=>{
      const mo=Math.max(1,(new Date(g.date)-T0)/864e5/30.4),req=Math.max(0,(num(g.t)-num(g.s))/mo);need+=req;
      return `<tr><td>${esc(g.n||"Goal")}</td><td>${fmt(num(g.t)-num(g.s))}</td><td>${g.date?dlabel(new Date(g.date)):"–"}</td><td>${fmt(req)}</td></tr>`});
    const gap=mS.net-need;
    h+=`<div class="box" style="margin-top:12px"><h2 style="margin-top:0">Savings goals</h2><div style="overflow-x:auto"><table><tr><th>Goal</th><th>Still needed</th><th>By</th><th>Per month</th></tr>${rows.join("")}</table></div>
    <p class="${gap>=0?"good":"bad"}" style="font-weight:600">${gap>=0?`On track: your plan leaves ${fmt(mS.net)} a month and your goals need ${fmt(need)}.`:`Short by ${fmt(-gap)} a month: your plan leaves ${fmt(mS.net)} and your goals need ${fmt(need)}.`}</p></div>`;
  }
  $("res").innerHTML=h;
}

const row=(l,i,x,cols)=>`<div class="row" style="grid-template-columns:${cols.map(c=>c[3]||"1fr").join(" ")} 30px">${cols.map(c=>`<input data-l="${l}" data-i="${i}" data-f="${c[0]}" type="${c[1]}" aria-label="${c[2]}" placeholder="${c[2]}" value="${esc(x[c[0]]??"")}">`).join("")}<button data-rm="${l}.${i}" aria-label="Remove">×</button></div>`;
const SEC=[
 ["inc","Money coming in","Allowance, stipend, part-time pay","income",[["n","text","Source","2fr"],["a","number","Amount"],["d","number","Day of month"]]],
 ["fix","Fixed monthly costs","Rent, mess, phone plan, subscriptions","cost",[["n","text","Name","2fr"],["a","number","Amount"],["d","number","Day of month"]]],
 ["vr","Everyday spending","Enter what you spend per week in each area","category",[["n","text","Category","2fr"],["a","number","Per week"]]],
 ["one","One-off events","Fees, trips, gadgets. Use a minus for money going out.","event",[["n","text","Event","2fr"],["a","number","Amount (− out)"],["date","date","Date","1.3fr"]]],
 ["goals","Savings goals","What you want to save for","goal",[["n","text","Goal","2fr"],["t","number","Target"],["s","number","Saved"],["date","date","By","1.3fr"]]]];
const BLANK={inc:{n:"",a:"",d:1},fix:{n:"",a:"",d:1},vr:{n:"",a:""},one:{n:"",a:"",date:plus(30)},goals:{n:"",t:"",s:0,date:plus(180)}};

function buildForm(){
  $("form").innerHTML=`<div class="bar"><button data-act="sample">Load sample</button><button data-act="clear">Clear all</button></div>
  <div class="two"><label>Currency<input id="cur" value="${esc(S.cur)}" maxlength="3"></label><label>Money you have today<input id="bal" type="number" value="${esc(S.bal)}"></label>
  <label>Forecast<select id="H">${[3,6,9,12].map(m=>`<option value="${m}"${+S.H===m?" selected":""}>${m} months</option>`).join("")}</select></label></div>`+
  SEC.map(s=>`<h2>${s[1]}</h2><small>${s[2]}</small><div style="margin-top:6px">${S[s[0]].map((x,i)=>row(s[0],i,x,s[4])).join("")}</div><button data-new="${s[0]}">Add ${s[3]}</button>`).join("");
}
const out=()=>{renderRes();save()};
document.addEventListener("input",e=>{
  const t=e.target,d=t.dataset;
  if(d.l){S[d.l][+d.i][d.f]=t.value;out()}
  else if(t.id==="cur"){S.cur=t.value||"₹";out()}
  else if(t.id==="bal"){S.bal=t.value;out()}
  else if(t.id==="cut"||t.id==="extra"){S[t.id]=+t.value;out()}
});
document.addEventListener("change",e=>{if(e.target.id==="H"){S.H=+e.target.value;out()}});
document.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  const d=b.dataset;
  if(d.new){S[d.new].push({...BLANK[d.new]});buildForm();out()}
  else if(d.rm){const[l,i]=d.rm.split(".");S[l].splice(+i,1);buildForm();out()}
  else if(d.act==="sample"){S=SAMPLE();buildForm();out()}
  else if(d.act==="clear"&&confirm("Clear all your numbers?")){S={cur:S.cur,bal:0,H:6,cut:0,extra:0,inc:[],fix:[],vr:[],one:[],goals:[]};buildForm();out()}
});
buildForm();out();
</script>
</body>
</html>
